name: Build SipSync Android

on:
  workflow_dispatch:
    inputs:
      restore_history:
        description: 'Include supplied Monday and Tuesday totals on fresh installs'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --release --build-name=1.0.1 --build-number=2 --dart-define=RESTORE_SCREENSHOT_HISTORY=${{ inputs.restore_history }}
      - name: Build Android App Bundle
        run: flutter build appbundle --release --build-name=1.0.1 --build-number=2 --dart-define=RESTORE_SCREENSHOT_HISTORY=${{ inputs.restore_history }}
      - name: Name packages
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SipSync.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/SipSync.aab
          sha256sum dist/SipSync.apk dist/SipSync.aab > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SipSync
          path: dist/
          retention-days: 30
          if-no-files-found: error
